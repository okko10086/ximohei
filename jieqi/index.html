<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>二十四节气查询器 · 精确到分</title>
<meta name="description" content="输入任意年份，得到该年 24 个节气的精确交节时刻（北京时间）。太阳视黄经过 15° 整数倍，Meeus 算法，已对国立天文台公布值验证。">
<link rel="icon" href="../img/seal.png">
<style>
@font-face{font-family:'Xi Mo Hei SC';src:url('../fonts/ximohai-medium.woff2') format('woff2');font-weight:500;font-display:swap}
@font-face{font-family:'Xi Mo Hei SC';src:url('../fonts/ximohai-heavy.woff2') format('woff2');font-weight:900;font-display:swap}
@font-face{font-family:'Xi Mo Hei SC';src:url('../fonts/ximohai-light.woff2') format('woff2');font-weight:300;font-display:swap}
:root{
  --paper:#EFE7DA; --paper2:#F7F3EA; --ink:#14100E; --ink2:#2A211B; --ink3:#6B5C51;
  --red:#B03A2E; --gold:#C9A961; --line:rgba(20,16,14,.14);
  --spring:#4A7A52; --summer:#B4552E; --autumn:#A8863C; --winter:#3E5666;
  --hei:'Xi Mo Hei SC',-apple-system,'PingFang SC','Microsoft YaHei',sans-serif;
  --song:'Xi Mo Hei SC',-apple-system,'PingFang SC',sans-serif;  /* 本页全部用戏墨黑 */
  --mono:ui-monospace,SFMono-Regular,Menlo,monospace;
}
*{box-sizing:border-box}
body{margin:0;color:var(--ink);font-family:var(--hei);font-weight:350;font-size:16px;line-height:1.75;
  background:var(--paper) url('../img/paper-tile.png') repeat;background-size:560px;
  -webkit-font-smoothing:antialiased}
a{color:var(--ink)}
.wrap{max-width:1080px;margin:0 auto;padding:0 5%}
header{padding:6vh 0 3vh;border-bottom:1px solid var(--line)}
h1{font-family:var(--hei);font-weight:900;font-size:clamp(32px,5vw,54px);line-height:1.1;
  letter-spacing:.02em;margin:0 0 14px}
.lede{max-width:38em;color:var(--ink2);margin:0 0 20px}
.how{font-size:13.5px;color:var(--ink3);border-left:2px solid var(--red);padding-left:14px;max-width:44em}
main{padding:4vh 0 6vh}

/* 控制条 */
.bar{display:flex;flex-wrap:wrap;gap:14px;align-items:center;padding:18px 0 22px;
  border-bottom:1px solid var(--line)}
.bar label{font-family:var(--hei);font-weight:300;font-size:12px;letter-spacing:.2em;
  text-transform:uppercase;color:var(--ink3)}
#year{font-family:var(--mono);font-size:26px;font-weight:600;width:120px;padding:8px 10px;
  border:1px solid var(--line);background:var(--paper2);color:var(--ink);text-align:center}
#year:focus{outline:0;border-color:var(--red)}
.nav{display:flex;gap:8px}
button{font-family:var(--hei);font-weight:400;font-size:13.5px;padding:9px 16px;cursor:pointer;
  background:transparent;border:1px solid var(--line);color:var(--ink2);transition:.15s}
button:hover{border-color:var(--red);color:var(--red)}
button.primary{background:var(--ink);border-color:var(--ink);color:var(--paper)}
button.primary:hover{background:var(--red);border-color:var(--red);color:#fff}

/* 下一个节气 */
.next{margin:26px 0 30px;border:1px solid var(--line);background:var(--paper2);
  display:grid;grid-template-columns:auto 1fr;gap:0;overflow:hidden}
.next .glyph{background:var(--ink);color:var(--paper);padding:22px 26px;display:flex;
  flex-direction:column;justify-content:center;align-items:center;min-width:150px}
.next .glyph .nm{font-family:var(--hei);font-weight:900;font-size:34px;letter-spacing:.06em}
.next .glyph .se{font-family:var(--hei);font-weight:300;font-size:11px;letter-spacing:.3em;
  opacity:.7;margin-top:6px}
.next .body{padding:20px 26px}
.next .cd{font-family:var(--hei);font-weight:700;font-size:clamp(20px,2.6vw,28px);letter-spacing:.01em}
.next .cd em{font-style:normal;color:var(--red);font-size:1.15em}
.next .when{font-family:var(--mono);font-size:15px;color:var(--ink3);margin-top:8px}
.next .when b{color:var(--ink);font-weight:600}

/* 表格 */
table{width:100%;border-collapse:collapse;font-size:15px}
thead th{font-family:var(--hei);font-weight:300;font-size:11px;letter-spacing:.22em;
  text-transform:uppercase;color:var(--ink3);text-align:left;padding:0 12px 10px;
  border-bottom:1px solid var(--line)}
tbody tr{border-bottom:1px solid rgba(20,16,14,.08)}
tbody tr:hover{background:rgba(176,58,46,.05)}
tbody tr.past{opacity:.42}
tbody tr.now{background:rgba(176,58,46,.09)}
tbody tr.now td{font-weight:600}
td{padding:11px 12px;vertical-align:baseline}
td.season{width:52px;font-family:var(--hei);font-weight:500;font-size:13px;text-align:center}
td.name{font-family:var(--hei);font-weight:700;font-size:19px;letter-spacing:.04em;width:110px}
td.date{font-family:var(--mono);font-size:14.5px;white-space:nowrap}
td.time{font-family:var(--mono);font-size:15px;font-weight:600;white-space:nowrap}
td.left{font-family:var(--mono);font-size:13px;color:var(--ink3);text-align:right;white-space:nowrap}
.s-春{color:var(--spring)} .s-夏{color:var(--summer)}
.s-秋{color:var(--autumn)} .s-冬{color:var(--winter)}
.q{display:inline-block;width:6px;height:6px;border-radius:50%;margin-right:7px;vertical-align:middle}
.q.春{background:var(--spring)} .q.夏{background:var(--summer)}
.q.秋{background:var(--autumn)} .q.冬{background:var(--winter)}

footer{padding:4vh 0 7vh;border-top:1px solid var(--line)}
.foot{display:flex;flex-wrap:wrap;gap:12px;align-items:center;justify-content:space-between}
.note{font-size:13px;color:var(--ink3);max-width:52em;margin-top:16px;line-height:1.8}
@media(max-width:640px){
  .next{grid-template-columns:1fr}
  td.name{font-size:17px;width:auto} td.season{width:38px}
  td.left{display:none} thead th:last-child{display:none}
}
</style>
</head>
<body>

<header>
  <div class="wrap">
    <h1>二十四节气查询器</h1>
    <p class="lede">输入任意年份，得到那一年 <strong>24 个节气的精确交节时刻</strong>（北京时间，精确到分）。</p>
    <p class="how"><strong>怎么算的：</strong>节气就是太阳视黄经经过 15° 整数倍的那一刻。
      用 Meeus 低精度太阳位置公式求视黄经，再牛顿迭代反解时刻；经度每差 0.01° 约合 15 分钟，
      所以结果是分钟级。已用国立天文台公布的 2026 年春分（3 月 20 日）与秋分（9 月 23 日）反向验证一致。</p>
  </div>
</header>

<main class="wrap">
  <div class="bar">
    <label for="year">年份</label>
    <input id="year" type="number" min="1900" max="2100" step="1" value="2026" inputmode="numeric">
    <div class="nav">
      <button id="prev">← 上一年</button>
      <button id="next">下一年 →</button>
      <button id="now" class="primary">回到今年</button>
    </div>
  </div>

  <div class="next" id="nextCard" hidden>
    <div class="glyph"><span class="nm" id="nName">—</span><span class="se" id="nSeason">—</span></div>
    <div class="body">
      <div class="cd" id="nCount">—</div>
      <div class="when" id="nWhen">—</div>
    </div>
  </div>

  <table>
    <thead>
      <tr><th>季</th><th>节气</th><th>日期</th><th>交节时刻</th><th>距今</th></tr>
    </thead>
    <tbody id="rows"></tbody>
  </table>

  <footer>
    <div class="foot">
      <div style="display:flex;gap:10px;flex-wrap:wrap">
        <button id="copy">复制这一年</button>
        <button id="csv">下载 CSV</button>
      </div>
      <span style="font-family:var(--hei);font-weight:300;font-size:11px;letter-spacing:.24em;color:var(--ink3)">
        24 SOLAR TERMS · BEIJING TIME UTC+8</span>
    </div>
    <p class="note" id="range"></p>
  </footer>
</main>

<script>
const RAD = Math.PI / 180;
function jdFromDate(y,m,d,h=0){ if(m<=2){y-=1;m+=12;}
  const A=Math.floor(y/100),B=2-A+Math.floor(A/4);
  return Math.floor(365.25*(y+4716))+Math.floor(30.6001*(m+1))+d+B-1524.5+h/24; }
function dateFromJD(jd){ const z=Math.floor(jd+0.5),f=jd+0.5-z; let A;
  if(z<2299161)A=z; else{const a=Math.floor((z-1867216.25)/36524.25);A=z+1+a-Math.floor(a/4);}
  const B=A+1524,C=Math.floor((B-122.1)/365.25),D=Math.floor(365.25*C),E=Math.floor((B-D)/30.6001);
  const day=B-D-Math.floor(30.6001*E)+f, mon=E<14?E-1:E-13, yr=mon>2?C-4716:C-4715;
  const di=Math.floor(day); return {y:yr,m:mon,d:di,h:(day-di)*24}; }
function sunLon(jd){ const T=(jd-2451545.0)/36525.0;
  const L0=280.46646+36000.76983*T+0.0003032*T*T;
  const M=(357.52911+35999.05029*T-0.0001537*T*T)*RAD;
  const C=(1.914602-0.004817*T-0.000014*T*T)*Math.sin(M)
         +(0.019993-0.000101*T)*Math.sin(2*M)+0.000289*Math.sin(3*M);
  const Om=(125.04-1934.136*T)*RAD;
  return (((L0+C-0.00569-0.00478*Math.sin(Om))%360)+360)%360; }
function findTerm(target,guess){ let jd=guess;
  for(let i=0;i<60;i++){ const d=((sunLon(jd)-target+180)%360+360)%360-180;
    jd-=d*(365.2422/360); if(Math.abs(d)<1e-9)break; } return jd; }

const NAMES=['小寒','大寒','立春','雨水','惊蛰','春分','清明','谷雨','立夏','小满','芒种','夏至',
             '小暑','大暑','立秋','处暑','白露','秋分','寒露','霜降','立冬','小雪','大雪','冬至'];
const SEASON=['冬','冬','春','春','春','春','春','春','夏','夏','夏','夏',
              '夏','夏','秋','秋','秋','秋','秋','秋','冬','冬','冬','冬'];

function termsOf(year){
  const out=[];
  for(let i=0;i<24;i++){
    const target=(285+15*i)%360;
    const g=new Date(Date.UTC(year,0,1)); g.setUTCDate(g.getUTCDate()+Math.floor(5.5+i*15.22));
    const jd=findTerm(target, jdFromDate(g.getUTCFullYear(),g.getUTCMonth()+1,g.getUTCDate(),12));
    const b=dateFromJD(jd+8/24);
    let hh=Math.floor(b.h), mm=Math.round((b.h-hh)*60);
    if(mm===60){hh+=1;mm=0;}
    out.push({name:NAMES[i],season:SEASON[i],y:b.y,m:b.m,d:b.d,hh,mm,
      ts:Date.UTC(b.y,b.m-1,b.d,hh-8,mm)});
  }
  return out;
}

const $=id=>document.getElementById(id);
const pad=n=>String(n).padStart(2,'0');
let cur=[], curYear=2026;

function render(year){
  curYear=year; $('year').value=year;
  cur=termsOf(year);
  const now=Date.now();
  let nextIdx=cur.findIndex(t=>t.ts>now);
  const tb=$('rows'); tb.innerHTML='';
  cur.forEach((t,i)=>{
    const tr=document.createElement('tr');
    const isNext=(i===nextIdx);
    if(t.ts<now) tr.className='past';
    if(isNext) tr.className='now';
    const left=Math.round((t.ts-now)/86400000);
    tr.innerHTML=
      '<td class="season s-'+t.season+'"><span class="q '+t.season+'"></span>'+t.season+'</td>'+
      '<td class="name">'+t.name+'</td>'+
      '<td class="date">'+t.m+' 月 '+t.d+' 日</td>'+
      '<td class="time">'+pad(t.hh)+':'+pad(t.mm)+'</td>'+
      '<td class="left">'+(t.ts<now? '已过' : (left===0?'今天':left+' 天后'))+'</td>';
    tb.appendChild(tr);
  });
  // 下一个节气卡片（跨年也算：当年剩余没有就取下一年的小寒）
  let nt = cur.find(t=>t.ts>now);
  if(!nt){ const nx=termsOf(year+1); nt=nx[0]; }
  $('nextCard').hidden=false;
  $('nName').textContent=nt.name;
  $('nSeason').textContent=nt.season+'季';
  const diff=nt.ts-now;
  const dd=Math.floor(diff/86400000), hh=Math.floor(diff%86400000/3600000);
  $('nCount').innerHTML = diff>0
    ? '距离 <em>'+nt.name+'</em> 还有 '+dd+' 天 '+hh+' 小时'
    : '<em>'+nt.name+'</em> 就在今天';
  $('nWhen').innerHTML='交节时刻 <b>'+(nt.y)+' 年 '+(nt.m)+' 月 '+(nt.d)+' 日 '
    +pad(nt.hh)+':'+pad(nt.mm)+'</b>（北京时间）';
  $('range').textContent='可查 1900–2100 年。结果按北京时间（UTC+8）给出，精确到分；'
    +'境外使用请自行换算时区。算法为天文计算值，与紫金山天文台《中国天文年历》刊布值在本世纪内一致。';
}

$('year').addEventListener('change',e=>{
  let v=parseInt(e.target.value,10);
  if(isNaN(v)) v=curYear;
  v=Math.max(1900,Math.min(2100,v));
  render(v);
});
$('prev').onclick=()=>render(Math.max(1900,curYear-1));
$('next').onclick=()=>render(Math.min(2100,curYear+1));
$('now').onclick=()=>render(new Date().getFullYear());
$('copy').onclick=async()=>{
  const txt=curYear+' 年二十四节气（北京时间）\n'+cur.map(t=>
    t.name+'  '+t.m+'月'+t.d+'日 '+pad(t.hh)+':'+pad(t.mm)).join('\n');
  try{ await navigator.clipboard.writeText(txt); $('copy').textContent='已复制 ✓';
    setTimeout(()=>$('copy').textContent='复制这一年',1600); }
  catch(e){ $('copy').textContent='复制失败，请手动选择'; }
};
$('csv').onclick=()=>{
  const rows=[['节气','季节','年','月','日','时','分']].concat(
    cur.map(t=>[t.name,t.season,t.y,t.m,t.d,t.hh,t.mm]));
  const csv='\uFEFF'+rows.map(r=>r.join(',')).join('\n');
  const a=document.createElement('a');
  a.href=URL.createObjectURL(new Blob([csv],{type:'text/csv'}));
  a.download='二十四节气_'+curYear+'.csv'; a.click();
};
render(new Date().getFullYear());
</script>
</body>
</html>
